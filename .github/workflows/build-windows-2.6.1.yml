name: Build Windows 2.6.1
on:
  push:
    paths:
      - 'WIN_261_TRIGGER.txt'
      - '.github/workflows/build-windows-2.6.1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', architecture: x64}
      - name: Install tools
        shell: powershell
        run: |
          choco install ffmpeg innosetup -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install PySide6 Pillow pyinstaller
      - name: Extract 2.6.1 source snapshot
        shell: powershell
        run: |
          $archive='release/enki_agency_uniq_2.6.1_macos.zip'
          if (!(Test-Path $archive)) { throw "Missing $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath src261 -Force
          $app=Get-ChildItem src261 -Recurse -File -Filter app.py | Select-Object -First 1
          $eng=Get-ChildItem src261 -Recurse -File -Filter uniquify_engine.py | Select-Object -First 1
          if (!$app -or !$eng) { throw 'Sources not found' }
          New-Item -ItemType Directory -Force source_261 | Out-Null
          Copy-Item $app.FullName source_261/app.py -Force
          Copy-Item $eng.FullName source_261/uniquify_engine.py -Force
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add source_261
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Expose 2.6.1 source snapshot for 2.7.0'
            git pull --rebase origin main
            git push origin HEAD:main
          }
      - name: Stop after source snapshot
        shell: powershell
        run: Write-Host 'Source snapshot ready for 2.7.0 development'
