name: Extract 2.6.1 source
on:
  push:
    paths: ['.github/workflows/extract-source-261.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          set -e
          rm -rf source_261 tmp261
          mkdir tmp261 source_261
          unzip -q release/enki_agency_uniq_2.6.1_macos.zip -d tmp261
          APP=$(find tmp261 -name app.py -type f | head -1)
          ENG=$(find tmp261 -name uniquify_engine.py -type f | head -1)
          test -n "$APP" && test -n "$ENG"
          cp "$APP" source_261/app.py
          cp "$ENG" source_261/uniquify_engine.py
          CAP=$(find tmp261 -name captions.json -type f | head -1 || true)
          test -z "$CAP" || cp "$CAP" source_261/captions.json
          echo "source extraction: 2.7.0 development"
      - name: Commit source snapshot
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add source_261
          git commit -m 'Extract 2.6.1 source snapshot for 2.7.0'
          git push
