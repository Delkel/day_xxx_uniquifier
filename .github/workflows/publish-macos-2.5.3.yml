name: Publish macOS 2.5.3 fast updater

on:
  push:
    paths:
      - MAC_253_TRIGGER_V2.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare 2.5.3 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mac253
          mkdir -p mac253
          ditto -x -k release/enki_agency_uniq_2.5.2_macos.zip mac253
          APP_PY="$(find mac253 -name app.py -type f | head -1)"
          BOOTSTRAP="$(find mac253 -name bootstrap.sh -type f | head -1)"
          test -n "$APP_PY"
          test -n "$BOOTSTRAP"
          export APP_PY BOOTSTRAP

          python3 <<'PY'
          import os, re
          from pathlib import Path

          app = Path(os.environ["APP_PY"])
          s = app.read_text(encoding="utf-8")
          s = re.sub(r'APP_VERSION\s*=\s*["\'][^"\']+["\']', 'APP_VERSION = "2.5.3"', s, count=1)

          if "import webbrowser" not in s:
              a = "import urllib.request\n"
              s = s.replace(a, a + "import webbrowser\n", 1) if a in s else "import webbrowser\n" + s

          if "TEAM_URL =" not in s and "TELEGRAM_BOT_URL =" not in s:
              a = "UPDATE_MANIFEST_URL = "
              i = s.find(a)
              if i >= 0:
                  j = s.find("\n", i)
                  s = s[:j+1] + 'TEAM_URL = "https://t.me/enki_agency_bot"\n' + s[j+1:]
              else:
                  s = 'TEAM_URL = "https://t.me/enki_agency_bot"\n' + s

          team_const = "TEAM_URL" if "TEAM_URL =" in s else "TELEGRAM_BOT_URL"

          if "def open_team(self)" not in s:
              a = "    def apply_style(self):"
              if a not in s:
                  a = "    def open_path(self,path):"
              if a not in s:
                  raise RuntimeError("No MainWindow method anchor")
              method = "    def open_team(self):\n        webbrowser.open(" + team_const + ", new=2)\n\n"
              s = s.replace(a, method + a, 1)

          if "logo.mousePressEvent" not in s:
              a = "side.addWidget(logo)"
              if a not in s:
                  raise RuntimeError("Logo anchor missing")
              add = 'logo.setCursor(Qt.PointingHandCursor)\n        logo.setToolTip("Перейти в команду")\n        logo.mousePressEvent=lambda event:self.open_team()\n        '
              s = s.replace(a, add + a, 1)

          if "↗  Перейти в команду" not in s:
              candidates = [
                  '("⬆  Проверить обновления",self.check_updates)',
                  '("⬆  Проверить обновление",self.check_updates)',
                  '("Проверить обновления",self.check_updates)',
              ]
              for old in candidates:
                  if old in s:
                      s = s.replace(old, '("↗  Перейти в команду",self.open_team),' + old, 1)
                      break
              else:
                  raise RuntimeError("Update action anchor missing")

          start = s.find("def run_command_in_terminal(path: Path):")
          end = s.find("\n\nclass UpdateWorker", start)
          if start >= 0 and end > start:
              block = "\n".join([
                  "def run_command_in_terminal(path: Path):",
                  '    if platform.system()=="Darwin":',
                  '        subprocess.Popen(["/bin/sh",str(path)], start_new_session=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)',
                  '    elif platform.system()=="Windows":',
                  '        subprocess.Popen(["powershell.exe","-NoProfile","-ExecutionPolicy","Bypass","-File",str(path)])',
                  "    else:",
                  '        subprocess.Popen(["sh",str(path)])',
                  "",
              ])
              s = s[:start] + block + s[end:]

          s = s.replace('/bin/bash "$S/Contents/Resources/bootstrap.sh"\n', "")
          s = s.replace('mkdir -p "$D"; rm -rf "$A"; ditto "$S" "$A"', 'sleep 2\nmkdir -p "$D"; rm -rf "$A"; ditto "$S" "$A"')
          app.write_text(s, encoding="utf-8")

          boot = Path(os.environ["BOOTSTRAP"])
          bs = boot.read_text(encoding="utf-8")
          if "ENKI_FAST_UPDATE_PATH" not in bs:
              marker = 'echo "== Enki Agency Uniq: установка =="\n'
              fast = "\n".join([
                  "# ENKI_FAST_UPDATE_PATH",
                  'if [ -x "$VENV_DIR/bin/python" ] && "$VENV_DIR/bin/python" -c \'import PySide6\' >/dev/null 2>&1 && command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then',
                  '  echo "Зависимости уже установлены — обновляю только Enki Agency Uniq."',
                  "  exit 0",
                  "fi",
                  "",
              ])
              bs = bs.replace(marker, marker + fast + "\n", 1) if marker in bs else fast + "\n" + bs
          boot.write_text(bs, encoding="utf-8")
          PY

          python3 -m py_compile "$APP_PY"
          chmod +x "$BOOTSTRAP"
          find mac253 -type f \( -name '*.command' -o -path '*/Contents/MacOS/*' \) -exec chmod +x {} \; || true
          grep -q 'APP_VERSION = "2.5.3"' "$APP_PY"
          grep -q 'Перейти в команду' "$APP_PY"
          grep -q 'enki_agency_bot' "$APP_PY"
          grep -q 'logo.mousePressEvent' "$APP_PY"
          grep -q 'start_new_session=True' "$APP_PY"
          grep -q 'ENKI_FAST_UPDATE_PATH' "$BOOTSTRAP"

          rm -f release/enki_agency_uniq_2.5.3_macos.zip
          (cd mac253 && ditto -c -k --sequesterRsrc . ../release/enki_agency_uniq_2.5.3_macos.zip)
          test -s release/enki_agency_uniq_2.5.3_macos.zip
          shasum -a 256 release/enki_agency_uniq_2.5.3_macos.zip

      - name: Publish 2.5.3 manifest
        shell: bash
        run: |
          cat > update-manifest.json <<'JSON'
          {
            "version": "2.5.3",
            "zip_url": "https://raw.githubusercontent.com/Delkel/day_xxx_uniquifier/main/release/enki_agency_uniq_2.5.3_macos.zip",
            "notes": "Enki Agency Uniq 2.5.3: исправлена кнопка «Перейти в команду» и кликабельный логотип ENKI. Обновление Mac ускорено: существующие Homebrew, FFmpeg и Python повторно не устанавливаются; будущие обновления запускаются без окна Terminal."
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/enki_agency_uniq_2.5.3_macos.zip update-manifest.json
          git commit -m "Publish Enki Agency Uniq 2.5.3 fast macOS update"
          git push
