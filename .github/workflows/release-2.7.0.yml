name: Release Enki Agency Uniq 2.7.0
on:
  push:
    paths:
      - 'RELEASE_270_TRIGGER.txt'
      - '.github/workflows/release-2.7.0.yml'
      - 'tools/prepare_270.py'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', architecture: x64}
      - name: Install tools
        shell: powershell
        run: |
          choco install ffmpeg innosetup -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install PySide6 Pillow pyinstaller
      - name: Prepare 2.7.0
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force work270 | Out-Null
          Copy-Item source_261/app.py work270/app.py
          Copy-Item source_261/uniquify_engine.py work270/uniquify_engine.py
          Copy-Item source_261/captions.json work270/captions.json
          Copy-Item source_261/EnkiAgencyUniq.png work270/EnkiAgencyUniq.png
          python tools/prepare_270.py
          python tools/patch_windows_261.py
          (Get-Content win/app.py -Raw).Replace('2.6.1','2.7.0') | Set-Content win/app.py -Encoding UTF8
          Copy-Item work270/uniquify_engine.py win/uniquify_engine.py -Force
          python -m py_compile win/app.py win/uniquify_engine.py
      - name: Build app and installer
        shell: powershell
        run: |
          Set-Location win
          @'
          # -*- mode: python ; coding: utf-8 -*-
          import os
          from PyInstaller.utils.hooks import collect_submodules
          datas=[('captions.json','.')]
          if os.path.exists('EnkiAgencyUniq.png'): datas.append(('EnkiAgencyUniq.png','.'))
          a=Analysis(['app.py'],datas=datas,hiddenimports=collect_submodules('PySide6')+['uniquify_engine'])
          pyz=PYZ(a.pure); exe=EXE(pyz,a.scripts,[],exclude_binaries=True,name='Enki Agency Uniq',console=False)
          coll=COLLECT(exe,a.binaries,a.datas,name='Enki Agency Uniq')
          '@ | Set-Content EnkiAgencyUniq.spec -Encoding UTF8
          pyinstaller --noconfirm --clean EnkiAgencyUniq.spec
          $dist='dist/Enki Agency Uniq'
          $ffmpeg=Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe=Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Recurse -File -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "$dist/ffmpeg.exe" -Force; Copy-Item $ffprobe.FullName "$dist/ffprobe.exe" -Force
          $p=Start-Process "$dist/Enki Agency Uniq.exe" -PassThru; Start-Sleep 6
          if ($p.HasExited) { throw 'Built app exited early' }; Stop-Process $p -Force
          $sourceDir=(Resolve-Path -LiteralPath $dist).Path
          @'
          #define MyAppName "Enki Agency Uniq"
          #define MyAppVersion "2.7.0"
          #ifndef SourceDir
            #error SourceDir missing
          #endif
          [Setup]
          AppId={{A8F7E919-927B-4C51-8CDA-250100000001}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=Enki Agency
          DefaultDirName={localappdata}\Programs\Enki Agency Uniq
          DefaultGroupName=Enki Agency Uniq
          OutputDir=installer
          OutputBaseFilename=Enki_Agency_Uniq_2.7.0_Setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=yes
          DisableProgramGroupPage=yes
          [Files]
          Source: "{#SourceDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Enki Agency Uniq"; Filename: "{app}\Enki Agency Uniq.exe"
          Name: "{autodesktop}\Enki Agency Uniq"; Filename: "{app}\Enki Agency Uniq.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create desktop shortcut"; Flags: checkedonce
          [Run]
          Filename: "{app}\Enki Agency Uniq.exe"; Description: "Launch Enki Agency Uniq"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer.iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSourceDir=$sourceDir" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $setup='installer/Enki_Agency_Uniq_2.7.0_Setup.exe'
          $r=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($r.ExitCode -ne 0) { throw 'Silent install failed' }
          $installed="$env:LOCALAPPDATA\Programs\Enki Agency Uniq\Enki Agency Uniq.exe"
          $p=Start-Process $installed -PassThru; Start-Sleep 6
          if ($p.HasExited) { throw 'Installed app exited early' }; Stop-Process $p -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Enki_Agency_Uniq_2.7.0_Setup
          path: win/installer/Enki_Agency_Uniq_2.7.0_Setup.exe

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS update package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mac270 work270
          mkdir work270 mac270
          cp source_261/app.py source_261/uniquify_engine.py work270/
          python3 tools/prepare_270.py
          ditto -x -k release/enki_agency_uniq_2.6.1_macos.zip mac270
          APP=$(find mac270 -name app.py -type f | head -1)
          ENG=$(find mac270 -name uniquify_engine.py -type f | head -1)
          cp work270/app.py "$APP"; cp work270/uniquify_engine.py "$ENG"
          python3 -m py_compile "$APP" "$ENG"
          grep -q 'APP_VERSION = "2.7.0"' "$APP"
          grep -q 'ThreadPoolExecutor' "$APP"
          find mac270 -type f \( -name '*.command' -o -name 'bootstrap.sh' -o -path '*/Contents/MacOS/*' \) -exec chmod +x {} \; || true
          (cd mac270 && ditto -c -k --sequesterRsrc . ../enki_agency_uniq_2.7.0_macos.zip)
          test -s enki_agency_uniq_2.7.0_macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: enki_agency_uniq_2.7.0_macos
          path: enki_agency_uniq_2.7.0_macos.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: Enki_Agency_Uniq_2.7.0_Setup, path: release270}
      - uses: actions/download-artifact@v4
        with: {name: enki_agency_uniq_2.7.0_macos, path: release270}
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.0
          name: Enki Agency Uniq 2.7.0
          body: "Enki Agency Uniq 2.7.0: faster batch processing, hardware capability detection, Windows and macOS release."
          files: |
            release270/Enki_Agency_Uniq_2.7.0_Setup.exe
            release270/enki_agency_uniq_2.7.0_macos.zip
          fail_on_unmatched_files: true
      - name: Publish updater manifest
        shell: bash
        run: |
          set -e
          cat > update-manifest.json <<'JSON'
          {
            "version": "2.7.0",
            "zip_url": "https://github.com/Delkel/day_xxx_uniquifier/releases/download/v2.7.0/enki_agency_uniq_2.7.0_macos.zip",
            "notes": "Enki Agency Uniq 2.7.0: ускорена пакетная обработка файлов и подготовлена аппаратная поддержка кодирования с безопасным CPU fallback.",
            "platforms": {
              "macos": {"url": "https://github.com/Delkel/day_xxx_uniquifier/releases/download/v2.7.0/enki_agency_uniq_2.7.0_macos.zip", "type": "zip"},
              "windows": {"url": "https://github.com/Delkel/day_xxx_uniquifier/releases/download/v2.7.0/Enki_Agency_Uniq_2.7.0_Setup.exe", "type": "setup"}
            }
          }
          JSON
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add update-manifest.json
          git commit -m 'Publish Enki Agency Uniq 2.7.0 updater' || true
          git pull --rebase origin main
          git push origin HEAD:main
