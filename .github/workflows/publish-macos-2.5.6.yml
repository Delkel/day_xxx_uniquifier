name: Publish macOS 2.5.6

on:
  push:
    paths:
      - 'MAC_256_TRIGGER_2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package
        run: |
          rm -rf mac256
          mkdir mac256
          ditto -x -k release/enki_agency_uniq_2.5.4_macos.zip mac256
          python3 tools/patch_mac_256.py
          APP_PY=$(find mac256 -name app.py -type f | head -1)
          python3 -m py_compile "$APP_PY"
          find mac256 -type f \( -name '*.command' -o -name 'bootstrap.sh' -o -path '*/Contents/MacOS/*' \) -exec chmod +x {} \; || true
          rm -f release/enki_agency_uniq_2.5.6_macos.zip
          cd mac256
          ditto -c -k --sequesterRsrc . ../release/enki_agency_uniq_2.5.6_macos.zip
          cd ..
          test -s release/enki_agency_uniq_2.5.6_macos.zip
      - name: Publish
        run: |
          printf '%s\n' '{' '  "version": "2.5.6",' '  "zip_url": "https://raw.githubusercontent.com/Delkel/day_xxx_uniquifier/main/release/enki_agency_uniq_2.5.6_macos.zip",' '  "notes": "Enki Agency Uniq 2.5.6: выровнены кнопки боковой панели, сохранены Telegram-переход и быстрые обновления."' '}' > update-manifest.json
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add release/enki_agency_uniq_2.5.6_macos.zip update-manifest.json
          git commit -m 'Publish Enki Agency Uniq 2.5.6 macOS'
          git push
