name: Publish macOS 2.5.2 updater

on:
  push:
    paths:
      - 'MAC_252_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare 2.5.2 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mac252
          mkdir -p mac252
          ditto -x -k release/enki_agency_uniq_2.4.4_compression_macos.zip mac252

          APP_PY="$(find mac252 -name app.py -type f | head -1)"
          test -n "$APP_PY"

          export APP_PY
          python3 <<'PY'
          import os, re
          from pathlib import Path

          p = Path(os.environ['APP_PY'])
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'APP_VERSION\s*=\s*["\'][^"\']+["\']', 'APP_VERSION = "2.5.2"', s, count=1)

          if 'TELEGRAM_BOT_URL = ' not in s:
              marker = 'UPDATE_MANIFEST_URL = '
              pos = s.find(marker)
              if pos >= 0:
                  end = s.find('\n', pos)
                  s = s[:end+1] + 'TELEGRAM_BOT_URL = "https://t.me/enki_agency_bot"\n' + s[end+1:]
              else:
                  s = 'TELEGRAM_BOT_URL = "https://t.me/enki_agency_bot"\n' + s

          if 'class ClickableLabel(QLabel):' not in s:
              marker = 'class MainWindow(QMainWindow):'
              cls = '''class ClickableLabel(QLabel):\n    clicked = Signal()\n\n    def mousePressEvent(self, event):\n        if event.button() == Qt.LeftButton:\n            self.clicked.emit()\n        super().mousePressEvent(event)\n\n\n'''
              s = s.replace(marker, cls + marker, 1)

          s = s.replace('logo = QLabel()', 'logo = ClickableLabel()', 1)
          logo_anchor = 'brand.addWidget(logo)'
          if 'logo.clicked.connect' not in s and logo_anchor in s:
              s = s.replace(logo_anchor, logo_anchor + '\n        logo.setCursor(Qt.PointingHandCursor)\n        logo.setToolTip("Перейти в команду")\n        logo.clicked.connect(lambda: subprocess.Popen(["open", TELEGRAM_BOT_URL]))', 1)

          if 'Перейти в команду' not in s[s.find('self.add_video_btn'):]:
              needle = '            side.addWidget(b)'
              if needle in s:
                  s = s.replace(needle, needle + '\n        self.team_btn = self.side_button("↗  Перейти в команду", lambda: subprocess.Popen(["open", TELEGRAM_BOT_URL]))\n        side.addWidget(self.team_btn)', 1)

          p.write_text(s, encoding='utf-8')
          PY

          python3 -m py_compile "$APP_PY"

          find mac252 -type f \( -name '*.command' -o -name 'bootstrap.sh' -o -path '*/Contents/MacOS/*' \) -exec chmod +x {} \; || true

          rm -f release/enki_agency_uniq_2.5.2_macos.zip
          (cd mac252 && ditto -c -k --sequesterRsrc . ../release/enki_agency_uniq_2.5.2_macos.zip)
          test -s release/enki_agency_uniq_2.5.2_macos.zip
          shasum -a 256 release/enki_agency_uniq_2.5.2_macos.zip

      - name: Publish manifest
        shell: bash
        run: |
          cat > update-manifest.json <<'JSON'
          {
            "version": "2.5.2",
            "zip_url": "https://raw.githubusercontent.com/Delkel/day_xxx_uniquifier/main/release/enki_agency_uniq_2.5.2_macos.zip",
            "notes": "Enki Agency Uniq 2.5.2: добавлена кнопка «Перейти в команду», логотип ENKI открывает Telegram-бот @enki_agency_bot."
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/enki_agency_uniq_2.5.2_macos.zip update-manifest.json
          git commit -m "Publish Enki Agency Uniq 2.5.2 macOS update"
          git push
