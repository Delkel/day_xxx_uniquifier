name: Publish macOS 2.6.0

on:
  push:
    paths:
      - 'MAC_260_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mac260
          mkdir mac260
          ditto -x -k release/enki_agency_uniq_2.5.7_macos.zip mac260
          python3 tools/patch_mac_260.py
          APP_PY=$(find mac260 -name app.py -type f | head -1)
          test -n "$APP_PY"
          python3 -m py_compile "$APP_PY"
          grep -q 'APP_VERSION = "2.6.0"' "$APP_PY"
          grep -q 'self.compact_update_btn.clicked.connect(self.check_updates)' "$APP_PY"
          grep -q 'self.update_btn = self.compact_update_btn' "$APP_PY"
          grep -q 'logo.setFixedHeight(190)' "$APP_PY"
          grep -q 'min-height: 44px' "$APP_PY"
          find mac260 -type f \( -name '*.command' -o -name 'bootstrap.sh' -o -path '*/Contents/MacOS/*' \) -exec chmod +x {} \; || true
          rm -f release/enki_agency_uniq_2.6.0_macos.zip
          (cd mac260 && ditto -c -k --sequesterRsrc . ../release/enki_agency_uniq_2.6.0_macos.zip)
          test -s release/enki_agency_uniq_2.6.0_macos.zip
      - name: Publish
        shell: bash
        run: |
          cat > update-manifest.json <<'JSON'
          {
            "version": "2.6.0",
            "zip_url": "https://raw.githubusercontent.com/Delkel/day_xxx_uniquifier/main/release/enki_agency_uniq_2.6.0_macos.zip",
            "notes": "Enki Agency Uniq 2.6.0: исправлены отступы логотипа и бокового меню, все кнопки приведены к единому размеру, нижний статус и блок версии получили единый фон. Исправленная кнопка обновления 2.5.7 сохранена."
          }
          JSON
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add release/enki_agency_uniq_2.6.0_macos.zip update-manifest.json
          git commit -m 'Publish Enki Agency Uniq 2.6.0 macOS'
          git push
